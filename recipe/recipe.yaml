schema_version: 1

context:
  version: "1.43.120"
  hash: f479cbb7273b9c0ea589a91a7abe38badda6353fb7c237a22c7461a06d279ee2

package:
  name: botocore
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/b/botocore/botocore-${{ version }}.tar.gz
  sha256: ${{ hash }}

build:
  number: 0
  noarch: python
  script:
    # remove vendored certs, used only if certifi is not available
    - rm botocore/cacert.pem
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - jmespath >=0.7.1,<2.0.0
    - python-dateutil >=2.1,<3.0.0
    # https://github.com/boto/botocore/pull/3034
    #- urllib3 >=1.25.4,<1.27       # [not python_geq_310]
    # https://github.com/boto/botocore/pull/3141
    - urllib3 >=1.25.4,!=2.2.0,<3
    # certifi is needed to use system certificates
    - certifi

tests:
  - python:
      imports:
        - botocore
        - botocore.docs
        - botocore.vendored
        - botocore.vendored.requests
        - botocore.vendored.requests.packages
        - botocore.vendored.requests.packages.urllib3
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      # smoke test that certifi is used
      - python -c 'import botocore.httpsession as bh; assert "certifi" in bh.get_cert_path(True)'

about:
  license_file: LICENSE.txt
  license: Apache-2.0
  summary: Low-level, data-driven core of boto 3.
  description: |
    Provides the core functionality of Boto3, the AWS SDK for Python
  homepage: http://aws.amazon.com/sdk-for-python/
  repository: https://github.com/boto/botocore
  documentation: https://botocore.readthedocs.io/en/latest/

extra:
  recipe-maintainers:
    - hajapy
    - tkelman
    - ocefpaf
